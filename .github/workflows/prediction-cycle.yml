name: Prediction cycle example

# The canonical public repository keeps this workflow disabled in GitHub
# Actions. It remains checked in to demonstrate a scheduled caller without
# owning any production deployment.
on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    uses: ./.github/workflows/marketcaster-cycle.yml
    with:
      mode: observe
      exchange_id: ${{ vars.EXCHANGE_ID || 'polymarket-us' }}
      llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
      llm_base_url: ${{ vars.LLM_BASE_URL }}
      llm_model: ${{ vars.LLM_MODEL }}
      llm_catalog_model: ${{ vars.LLM_CATALOG_MODEL }}
      kalshi_api_base_url: ${{ vars.KALSHI_API_BASE_URL }}
      agent_memory_scope: ${{ vars.AGENT_MEMORY_SCOPE }}
      upload_artifact: false
    secrets: inherit
