name: Keep scheduled workflows active

on:
  schedule:
    - cron: "17 9 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  keepalive:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Keep scheduled workflows active
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"

          LAST_COMMIT="$(git log -1 --format=%ct "origin/$DEFAULT_BRANCH")"
          NOW="$(date +%s)"
          AGE_DAYS="$(( (NOW - LAST_COMMIT) / 86400 ))"

          if [ "$AGE_DAYS" -lt 30 ]; then
            echo "Repository was active $AGE_DAYS days ago; no keepalive needed."
            exit 0
          fi

          printf 'Last repository keepalive: %s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:$DEFAULT_BRANCH"
