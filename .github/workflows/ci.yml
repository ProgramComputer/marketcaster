name: CI

on:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check runtime overrides
        run: npm run check:overrides

      - name: Check extension and state boundaries
        run: |
          npm run check:policy
          npm run check:state-lifecycle
          npm run check:execution-health
          npm run check:source-and-reconciliation
          npm run check:observe
